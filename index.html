<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayCap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #fff; text-align: center; padding: 16px; }
    
    header { margin-bottom: 24px; }
    h1 { font-size: 1.8rem; font-weight: 800; }
    p.subtitle { color: #8e8e93; font-size: 0.9rem; margin-top: 4px; }

    /* VISTA 1: HOME */
    #home-view { display: block; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 80px;
    }

    .photo-card {
      background: #1c1c1e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2c2c2e;
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .photo-time {
      padding: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #0a84ff;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 40px 20px;
      color: #636366;
    }

    /* VISTA 2: FOTOCAMERA (Nascosta all'inizio) */
    #camera-view { display: none; }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 20px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas { display: none; }

    /* PULSANTI */
    .btn {
      background: #0a84ff;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }

    .btn:active { opacity: 0.8; }
    .btn-secondary { background: #2c2c2e; color: #fff; margin-top: 12px; }

    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1>DayCap 📸</h1>
    <p class="subtitle">Il tuo diario orario visivo</p>
  </header>

  <!-- HOME PAGE -->
  <main id="home-view">
    <div id="gallery" class="gallery-grid">
      <div id="empty-state" class="empty-state">
        <p>Nessuno scatto salvato oggi.</p>
        <p style="font-size: 0.8rem; margin-top: 6px;">Premi "Scatta Foto" per iniziare!</p>
      </div>
    </div>

    <div class="bottom-bar">
      <button id="open-camera-btn" class="btn">➕ Scatta Foto</button>
    </div>
  </main>

  <!-- FOTOCAMERA -->
  <main id="camera-view">
    <div class="camera-container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <button id="snap-btn" class="btn">📸 Scatta ora</button>
    <br>
    <button id="back-btn" class="btn btn-secondary">Annulla</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
