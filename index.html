<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayCap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 1.8rem; }
    
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 20px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video, canvas, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas { display: none; }

    .btn {
      background: #007aff;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:active { background: #0056b3; }
    .btn:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>DayCap 📸</h1>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="photo-preview" alt="Anteprima foto" style="display: none;" />
  </div>

  <button id="snap-btn" class="btn">Scatta Foto</button>

  <script src="app.js"></script>
</body>
</html>
